<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Delo — от условий заказа до оплаты</title>
  <desc id="desc">Сервис для самозанятых и фрилансеров. Один заказ объединяет условия, подтверждение клиентом, оплату и документы.</desc>

  <rect width="1200" height="340" rx="28" fill="#0D1117"/>

  <g id="identity" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="64" y="76" fill="#BBABFF" font-size="18" font-weight="650" letter-spacing="1.5">РАБОЧЕЕ ПРОСТРАНСТВО ФРИЛАНСЕРА</text>
    <text x="60" y="168" fill="#F8F7FF" font-size="88" font-weight="760" letter-spacing="-4">Delo<tspan fill="#A785FF">.</tspan></text>
    <text x="64" y="222" fill="#F8F7FF" font-size="31" font-weight="640">Заказ, с которым всё ясно.</text>
    <text x="64" y="265" fill="#BDC2D0" font-size="21">Условия, согласование и оплата —</text>
    <text x="64" y="295" fill="#BDC2D0" font-size="21">в одном рабочем процессе.</text>
  </g>

  <g id="order-process" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="706" y="42" width="434" height="256" rx="22" fill="#171D29" stroke="#3C4556"/>
    <text x="738" y="82" fill="#BBABFF" font-size="18" font-weight="640" letter-spacing="1.2">ОДИН ЗАКАЗ / ТРИ ШАГА</text>
    <path d="M756 123 V250" fill="none" stroke="#6944A8" stroke-width="3" stroke-linecap="round"/>

    <circle cx="756" cy="125" r="11" fill="#A785FF"/>
    <text x="790" y="133" fill="#F8F7FF" font-size="24" font-weight="600">Зафиксировать условия</text>

    <circle cx="756" cy="188" r="11" fill="#A785FF"/>
    <text x="790" y="196" fill="#F8F7FF" font-size="24" font-weight="600">Получить подтверждение</text>

    <circle cx="756" cy="251" r="11" fill="#A785FF"/>
    <text x="790" y="259" fill="#F8F7FF" font-size="24" font-weight="600">Отметить оплату</text>
  </g>
</svg>
