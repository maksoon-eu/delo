<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Delo — порядок в работе с клиентскими заказами</title>
  <desc id="desc">Обложка показывает заказ на создание сайта и его путь через согласование условий, подтверждение клиента, оплату и документы.</desc>

  <defs>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#BBABFF"/>
    </linearGradient>
    <radialGradient id="focus" cx="0" cy="0" r="1" gradientTransform="translate(1040 80) rotate(135) scale(420 360)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED" stop-opacity=".22"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="420" rx="28" fill="#0D1117"/>
  <rect width="1200" height="420" rx="28" fill="url(#focus)"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="64" y="66" fill="#BBABFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600" letter-spacing="2">РАБОЧЕЕ ПРОСТРАНСТВО ФРИЛАНСЕРА</text>
    <text x="60" y="160" fill="#F8F7FF" font-size="82" font-weight="760" letter-spacing="-4">Delo<tspan fill="#7C3AED">.</tspan></text>
    <text x="64" y="215" fill="#F8F7FF" font-size="30" font-weight="620">Заказы без хаоса в чатах</text>
    <text x="64" y="257" fill="#9CA3AF" font-size="21">Условия, согласование, оплата и документы</text>
    <text x="64" y="288" fill="#9CA3AF" font-size="21">собраны в одном понятном процессе.</text>

    <g transform="translate(64 334)">
      <rect width="250" height="44" rx="22" fill="#7C3AED"/>
      <text x="125" y="29" fill="#FFFFFF" font-size="16" font-weight="650" text-anchor="middle">ОДИН ЗАКАЗ · ОДНА ССЫЛКА</text>
    </g>
  </g>

  <g id="order-proof" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="650" y="44" width="486" height="250" rx="22" fill="#151A23" stroke="#303746" stroke-width="1.5"/>

    <text x="682" y="80" fill="#9CA3AF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600" letter-spacing="1.5">ЗАКАЗ / 024</text>
    <g transform="translate(938 60)">
      <rect width="166" height="36" rx="18" fill="#7C3AED" fill-opacity=".18" stroke="#7C3AED" stroke-opacity=".55"/>
      <circle cx="18" cy="18" r="5" fill="#BBABFF"/>
      <text x="96" y="24" fill="#E5DBFF" font-size="17" font-weight="650" text-anchor="middle">НА ПРОВЕРКЕ</text>
    </g>

    <text x="682" y="132" fill="#F8F7FF" font-size="29" font-weight="680">Сайт для кофейни «Маяк»</text>
    <text x="682" y="166" fill="#9CA3AF" font-size="19">Клиент · Анна Смирнова</text>

    <line x1="682" y1="188" x2="1104" y2="188" stroke="#303746"/>

    <text x="682" y="222" fill="#9CA3AF" font-size="18">Прототип и дизайн</text>
    <text x="1104" y="222" fill="#F8F7FF" font-size="18" font-weight="620" text-anchor="end">45 000 ₽</text>
    <text x="682" y="255" fill="#9CA3AF" font-size="18">Разработка и запуск</text>
    <text x="1104" y="255" fill="#F8F7FF" font-size="18" font-weight="620" text-anchor="end">40 000 ₽</text>

    <rect x="666" y="276" width="454" height="36" rx="18" fill="#0D1117" stroke="#303746"/>
    <text x="686" y="300" fill="#9CA3AF" font-size="17">Итого</text>
    <text x="1100" y="300" fill="#BBABFF" font-size="20" font-weight="720" text-anchor="end">85 000 ₽</text>
  </g>

  <g id="order-route" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <path d="M690 348 H1096" fill="none" stroke="#303746" stroke-width="4" stroke-linecap="round"/>
    <path d="M690 348 H962" fill="none" stroke="url(#route)" stroke-width="4" stroke-linecap="round"/>

    <g transform="translate(690 348)">
      <circle r="12" fill="#7C3AED"/>
      <path d="M-5 0 -1 4 6 -5" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="42" fill="#F8F7FF" font-size="18" font-weight="620" text-anchor="middle">Условия</text>
    </g>
    <g transform="translate(826 348)">
      <circle r="12" fill="#7C3AED"/>
      <path d="M-5 0 -1 4 6 -5" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="42" fill="#F8F7FF" font-size="18" font-weight="620" text-anchor="middle">Клиент</text>
    </g>
    <g transform="translate(962 348)">
      <circle r="12" fill="#BBABFF"/>
      <circle r="5" fill="#0D1117"/>
      <text x="0" y="42" fill="#F8F7FF" font-size="18" font-weight="620" text-anchor="middle">Оплата</text>
    </g>
    <g transform="translate(1096 348)">
      <circle r="11" fill="#151A23" stroke="#596174" stroke-width="2"/>
      <text x="0" y="42" fill="#9CA3AF" font-size="18" font-weight="620" text-anchor="middle">Документы</text>
    </g>
  </g>
</svg>
